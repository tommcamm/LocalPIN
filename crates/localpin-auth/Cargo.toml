[package]
name = "localpin-auth"
description = "Bounded private password-only PAM enrollment worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
localpin-core.workspace = true
localpin-protocol = { path = "../localpin-protocol", version = "=0.1.0-alpha.2" }
rustix = { workspace = true, features = ["process", "time"] }
zeroize.workspace = true
libc = "=0.2.191"
getrandom = "=0.4.3"
sha2 = { version = "=0.11.1", default-features = false }

# The Linux-PAM ABI and libc allocator boundary are isolated in pam.rs.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
