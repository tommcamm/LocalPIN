[package]
name = "localpin-storage"
description = "Protected Linux storage and durable LocalPIN policy adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test-only opt-in keeps native TPM dependencies out of ordinary storage builds.
tpm-simulator-tests = ["dep:localpin-tpm", "localpin-tpm/simulator"]

[dependencies]
localpin-core.workspace = true
localpin-tpm = { path = "../localpin-tpm", version = "=0.1.0-alpha.4", optional = true }
rustix.workspace = true
zeroize.workspace = true

[dev-dependencies]
localpin-credentials = { path = "../localpin-credentials", version = "=0.1.0-alpha.4" }

[lints]
workspace = true
