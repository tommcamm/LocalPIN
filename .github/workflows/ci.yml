name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          LOCALPIN_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$LOCALPIN_TOOLCHAIN" --profile minimal --component clippy --component rustfmt --no-self-update
          rustc --version --verbose
          cargo --version --verbose
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests and doctests
        run: cargo test --workspace --all-features --locked
      - name: Build release artifacts
        run: cargo build --workspace --all-features --release --locked

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          LOCALPIN_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$LOCALPIN_TOOLCHAIN" --profile minimal --no-self-update
      - name: Install the pinned dependency checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check advisories, licenses, bans, and sources
        run: cargo deny --locked check advisories licenses bans sources

  fedora:
    name: Fedora 44 x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: fedora:44
    steps:
      - name: Install build tools in the disposable container
        run: dnf install -y ca-certificates gcc git python3 rustup
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          test "$(uname -m)" = x86_64
          rustup-init -y --no-modify-path --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          LOCALPIN_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          "$HOME/.cargo/bin/rustup" toolchain install "$LOCALPIN_TOOLCHAIN" --profile minimal --no-self-update
      - name: Record Fedora build inputs
        run: |
          cat /etc/os-release
          rpm -q gcc glibc git rustup
          rustc --version --verbose
          cargo --version --verbose
      - name: Build with the committed lockfile
        run: cargo build --workspace --all-features --release --locked --target x86_64-unknown-linux-gnu
      - name: Run tests on Fedora
        run: cargo test --workspace --all-features --locked --target x86_64-unknown-linux-gnu

  feasibility:
    name: Isolated M1 experiments (Fedora 44)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: fedora:44
    steps:
      - name: Install experiment tools in the disposable container
        run: dnf install -y gcc git python3 pam-devel systemd-devel swtpm tpm2-tools libargon2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test sanitized PAM graph and session discovery
        run: python3 -m unittest discover -s experiments/m1/platform -p 'test_*.py' -v
      - name: Check guarded VM fixture sources without installing them
        run: |
          python3 -m unittest discover -s experiments/m1/vm/selinux -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/m1/vm/worker-positive -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/m1/vm/kde-contact -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/m1/vm/sessions -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/m1/vm/eligibility -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/m1/vm/topology -p 'test_*.py' -v
          python3 experiments/m1/vm/pam/run.py --compile-only
          python3 experiments/m1/vm/kde/manage.py compile-only
          python3 experiments/m1/vm/kde/manage.py compile-only --contact-fixture
          python3 experiments/m1/vm/kde/manage.py compile-only --routing-fixture
          python3 experiments/m1/vm/topology/launch.py compile-only
          python3 experiments/m1/vm/sessions/run.py --compile-only
          python3 experiments/m1/vm/eligibility/run.py --compile-only
          gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror experiments/m1/vm/eligibility/test_format.c -lpam -o /tmp/localpin-m1-format-only
          /tmp/localpin-m1-format-only
          rm /tmp/localpin-m1-format-only
          python3 experiments/m1/vm/worker-positive/run.py --compile-only
          gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror experiments/m1/vm/selinux/fixture.c -lpam -o /tmp/localpin-m1-boundary-compile-only
          rm /tmp/localpin-m1-boundary-compile-only
      - name: Run isolated PAM baselines and candidate tests
        run: experiments/m1/pam/run.sh
      - name: Test native worker deadlines and bounds
        run: python3 experiments/m1/worker/test_supervisor.py
      - name: Run disposable TPM simulator assertions
        run: python3 experiments/m1/tpm/run.py
