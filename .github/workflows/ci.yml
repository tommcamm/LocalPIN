name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_commit:
        description: Exact prepared source commit to validate
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  LOCALPIN_SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}

jobs:
  quality:
    name: Rust lint and build (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - name: Install native TPM build inputs
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev libdbus-1-dev pkg-config
      - name: Install the pinned Rust toolchain
        run: |
          LOCALPIN_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$LOCALPIN_TOOLCHAIN" --profile minimal --component clippy --component rustfmt --no-self-update
          rustc --version --verbose
          cargo --version --verbose
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check the separate M9 test harnesses
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
          python3 -m py_compile fuzz/run.py experiments/m9/native_instrumentation.py
      # Native PAM tests use Fedora's reviewed runtime paths. The Fedora job
      # below runs the complete workspace test/doctest suite on the target OS.
      - name: Check activation transactions and disposable VM guards
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/m8 -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/m82 -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/m83 -p 'test_*.py' -v
          python3 -m py_compile experiments/m82/*.py
          python3 -m py_compile experiments/m83/*.py
          python3 -m unittest discover -s packaging/fedora -p 'test_release*.py' -v
      - name: Build release artifacts
        run: cargo build --workspace --all-features --release --locked

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          LOCALPIN_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$LOCALPIN_TOOLCHAIN" --profile minimal --no-self-update
      - name: Install the pinned dependency checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check advisories, licenses, bans, and sources
        run: |
          cargo deny --locked check advisories licenses bans sources
          cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml --locked check advisories licenses bans sources

  fedora:
    name: Fedora 44 x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: fedora:44
    steps:
      - name: Install build tools in the disposable container
        run: dnf install -y ca-certificates gcc git python3 rustup pkgconf-pkg-config tpm2-tss-devel dbus-devel swtpm tpm2-tools pam-devel binutils rpm-build checkpolicy policycoreutils systemd selinux-policy-targeted
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          test "$(uname -m)" = x86_64
          rustup-init -y --no-modify-path --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          LOCALPIN_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          "$HOME/.cargo/bin/rustup" toolchain install "$LOCALPIN_TOOLCHAIN" --profile minimal --no-self-update
      - name: Record Fedora build inputs
        run: |
          cat /etc/os-release
          rpm -q gcc glibc git rustup tpm2-tss-devel dbus-devel swtpm libtpms tpm2-tools pam dbus-libs tpm2-tss systemd selinux-policy-targeted
          rustc --version --verbose
          cargo --version --verbose
      - name: Build with the committed lockfile
        run: cargo build --workspace --all-features --release --locked --target x86_64-unknown-linux-gnu
      - name: Run tests on Fedora
        run: cargo test --workspace --all-features --locked --target x86_64-unknown-linux-gnu
      - name: Check the native PAM module ABI without loading a host policy
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror crates/localpin-pam/tests/abi_smoke.c -ldl -o /tmp/localpin-pam-abi
          /tmp/localpin-pam-abi "$GITHUB_WORKSPACE/target/x86_64-unknown-linux-gnu/release/liblocalpin_pam.so"
          nm -D --defined-only target/x86_64-unknown-linux-gnu/release/liblocalpin_pam.so
          rm /tmp/localpin-pam-abi
      - name: Verify M4 against disposable TPM simulators
        run: CARGO_BUILD_TARGET=x86_64-unknown-linux-gnu python3 crates/localpin-tpm/tests/run_simulator.py
      - name: Verify durable storage with the native TPM backend
        run: cargo test -p localpin-storage --features tpm-simulator-tests --locked --target x86_64-unknown-linux-gnu -- --ignored
      - name: Compile confinement and build the opt-in RPM without installing it
        run: |
          python3 packaging/fedora/test_packaging.py
          LOCALPIN_RPM_PREFIX=$(python3 packaging/fedora/release-policy.py --rpm-prefix)
          python3 packaging/fedora/build-rpm.py --output /tmp/localpin-rpm-ci \
            --release "${LOCALPIN_RPM_PREFIX}.ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
      - name: Collect the testing RPM, provenance, and checksums
        env:
          LOCALPIN_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import tarfile

          build = Path('/tmp/localpin-rpm-ci')
          packages = sorted((build / 'RPMS/x86_64').glob('*.rpm'))
          sources = sorted((build / 'SOURCES').glob('*-native.tar.gz'))
          if len(packages) != 1 or len(sources) != 1:
              raise SystemExit('Expected exactly one native RPM and one build-input bundle')
          # Container steps can run under a different owner than checkout.
          # Trust only this workspace for this read-only Git invocation.
          source_commit = subprocess.check_output(['git', '-c', f'safe.directory={Path.cwd()}', 'rev-parse', 'HEAD'], text=True).strip()
          if source_commit != os.environ['LOCALPIN_SOURCE_COMMIT']:
              raise SystemExit('Checked-out source differs from the selected source commit')
          output = Path(os.environ['RUNNER_TEMP']) / 'localpin-artifact'
          output.mkdir()
          shutil.copy2(packages[0], output / packages[0].name)
          with tarfile.open(sources[0], 'r:gz') as archive:
              member = sources[0].name.removesuffix('.tar.gz') + '/BUILD-INPUTS.json'
              with archive.extractfile(member) as manifest:
                  (output / 'BUILD-INPUTS.json').write_bytes(manifest.read())
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          metadata = {
              'schema': 1,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'source_commit': source_commit,
              'pull_request_head_commit': os.environ.get('LOCALPIN_PR_HEAD_SHA') or None,
              'workflow_run_url': run_url,
              'run_number': os.environ['GITHUB_RUN_NUMBER'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'rpm': packages[0].name,
              'rpm_release': subprocess.check_output(['rpm', '-qp', '--queryformat', '%{RELEASE}', str(packages[0])], text=True),
              'signed': False,
          }
          (output / 'CI-BUILD.json').write_text(json.dumps(metadata, indent=2) + '\n')
          checksums = ''.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in sorted(output.iterdir()))
          (output / 'SHA256SUMS').write_text(checksums)
          PY
      - name: Upload the experimental Fedora RPM
        id: rpm_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: localpin-fedora44-x86_64-${{ env.LOCALPIN_SOURCE_COMMIT }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/localpin-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Add the RPM download to the workflow summary
        env:
          LOCALPIN_ARTIFACT_URL: ${{ steps.rpm_artifact.outputs.artifact-url }}
        run: |
          printf '## Experimental Fedora KDE 44 x86_64 RPM\n\n[Download the testing RPM bundle](%s)\n\nIncludes the unsigned RPM, SHA256SUMS, BUILD-INPUTS.json, and CI-BUILD.json. Retained for 14 days.\n\nTest in a disposable Fedora KDE VM using the [installation and recovery runbook](%s/%s/blob/%s/docs/integration-administration.md).\n' \
            "$LOCALPIN_ARTIFACT_URL" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$LOCALPIN_SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"

  feasibility:
    name: Isolated M1 experiments (Fedora 44)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: fedora:44
    steps:
      - name: Install experiment tools in the disposable container
        run: dnf install -y gcc git python3 pam-devel systemd-devel swtpm tpm2-tools libargon2
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - name: Test sanitized PAM graph and session discovery
        run: python3 -m unittest discover -s experiments/m1/platform -p 'test_*.py' -v
      - name: Check guarded VM fixture sources without installing them
        run: |
          python3 -m unittest discover -s experiments/m1/vm/selinux -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/m1/vm/worker-positive -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/m1/vm/kde-contact -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/m1/vm/sessions -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/m1/vm/eligibility -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/m1/vm/topology -p 'test_*.py' -v
          python3 experiments/m1/vm/pam/run.py --compile-only
          python3 experiments/m1/vm/kde/manage.py compile-only
          python3 experiments/m1/vm/kde/manage.py compile-only --contact-fixture
          python3 experiments/m1/vm/kde/manage.py compile-only --routing-fixture
          python3 experiments/m1/vm/topology/launch.py compile-only
          python3 experiments/m1/vm/sessions/run.py --compile-only
          python3 experiments/m1/vm/eligibility/run.py --compile-only
          gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror experiments/m1/vm/eligibility/test_format.c -lpam -o /tmp/localpin-m1-format-only
          /tmp/localpin-m1-format-only
          rm /tmp/localpin-m1-format-only
          python3 experiments/m1/vm/worker-positive/run.py --compile-only
          python3 -m py_compile experiments/m7/run.py experiments/m7/cases.py experiments/m7/console.py experiments/m7/tpm.py
          gcc -std=c11 -O2 -Wall -Wextra -Werror experiments/m7/pam.c -lpam -o /tmp/localpin-m7-pam-compile-only
          rm /tmp/localpin-m7-pam-compile-only
          gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror experiments/m1/vm/selinux/fixture.c -lpam -o /tmp/localpin-m1-boundary-compile-only
          rm /tmp/localpin-m1-boundary-compile-only
      - name: Run isolated PAM baselines and candidate tests
        run: experiments/m1/pam/run.sh
      - name: Test native worker deadlines and bounds
        run: python3 experiments/m1/worker/test_supervisor.py
      - name: Run disposable TPM simulator assertions
        run: python3 experiments/m1/tpm/run.py
