# This policy covers the LocalPIN dependency graph, including build dependencies.
# Keep exceptions narrow, documented, and reviewed alongside dependency changes.
[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0"]
confidence-threshold = 0.95

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
